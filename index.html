<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Does Nothing</title>
<meta name="description" content="It is doing it right now" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#2b2622; --paper:#f4efe6; --soft:#8a8177; --sage:#5e7f45; --line:rgba(43,38,34,.14);
  --disp:"Instrument Serif",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.6vw,34px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9cfc0;color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- the room ---------- */
.room{position:fixed;inset:0;z-index:0;overflow:hidden;background:#cdbfae}
.room img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:opacity}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.22))}

/* ---------- chips ---------- */
.chip{background:rgba(244,239,230,.82);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.hud{position:fixed;z-index:8;display:flex;gap:7px;align-items:center}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad)}
.key{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);transition:background .2s}
.key:hover{background:rgba(244,239,230,.98)}
.key svg{width:13px;height:13px}
.key img{width:22px;height:22px;border-radius:50%}
.key.buy{background:var(--sage);color:#f4efe6;border-color:var(--sage)}
.key.buy:hover{background:#537239}
.btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}

/* ---------- ledger ---------- */
.ledger{position:fixed;left:var(--pad);top:clamp(88px,19vh,170px);z-index:7;display:grid;gap:1px;width:min(320px,44vw)}
.ledger .rw{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 13px;opacity:0;transform:translateY(6px);transition:opacity .55s,transform .55s}
.ledger .rw.on{opacity:1;transform:none}
.ledger .rw i{font-style:normal;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
.ledger .rw b{font-family:var(--disp);font-size:22px;font-weight:400;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.ledger .rw.live b{color:var(--sage)}

/* ---------- wordmark / clock ---------- */
.mark{position:fixed;left:var(--pad);bottom:var(--pad);z-index:7;padding:12px 15px;transition:opacity .5s}
.mark h1{font-family:var(--disp);font-weight:400;font-size:clamp(26px,3.6vw,44px);line-height:.98;letter-spacing:-.01em}
.mark h1 em{font-style:italic;color:var(--sage)}
.mark p{margin-top:5px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.clock{position:fixed;right:var(--pad);bottom:var(--pad);z-index:7;padding:9px 13px;text-align:right}
.clock b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.clock span{display:block;margin-top:2px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}

/* ---------- the card on the floor ---------- */
.card{position:fixed;left:auto;right:var(--pad);bottom:17%;z-index:6;width:min(370px,42vw);padding:16px 18px 18px;text-align:center;
  opacity:0;transform:translateY(26px) rotate(-1.1deg) scale(.96);transition:opacity .7s,transform .7s;pointer-events:none;
  box-shadow:0 18px 34px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.6) inset}
.card.on{opacity:1;transform:translateY(0) rotate(-1.1deg) scale(1);pointer-events:auto}
.card .l{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.ca{margin-top:9px;cursor:pointer;display:grid;gap:8px;justify-items:center}
.ca b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1;letter-spacing:.01em}
.ca.live b{font-family:var(--mono);font-weight:500;font-size:clamp(10px,2.7vw,14px);letter-spacing:0;color:var(--sage);word-break:break-all}
.ca .cp{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);padding:5px 11px;border:1px dashed var(--line)}
.ca.live .cp{border-style:solid;border-color:var(--sage);color:var(--sage)}
.card .btns{margin-top:14px}
.card .btns .key{border:1px solid var(--line);background:rgba(244,239,230,.7)}

.runway{position:relative;z-index:2;pointer-events:none}

@media (max-width:820px){
  .tr .key.buy span{display:none}
  .tr .key.buy{padding:0 11px}
  .tl span{display:none}
  .tl .key{padding:0 9px}
  .ledger{width:min(260px,62vw);top:calc(var(--pad) + 52px)}
  .ledger .rw{padding:7px 11px}
  .ledger .rw b{font-size:18px}
  .mark h1{font-size:24px}
  .clock b{font-size:20px}
  .card{right:auto;left:50%;bottom:auto;top:19%;width:min(400px,86vw);transform:translateX(-50%) translateY(26px) rotate(-1.1deg) scale(.96)}
  .card.on{transform:translateX(-50%) rotate(-1.1deg) scale(1)}
  .ca b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="room" id="room">
  <img src="assets/t1.webp" alt="" /><img src="assets/t2.webp" alt="" /><img src="assets/t3.webp" alt="" /><img src="assets/t4.webp" alt="" />
</div>
<div class="vig"></div>

<a class="hud tl key chip" href="/"><img src="assets/avatar.webp" alt="" /><span data-name>Does Nothing</span></a>
<nav class="hud tr">
  <a class="key chip buy" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>Buy</span><svg><use href="#i-pons"/></svg></a>
  <a class="key chip" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
  <a class="key chip" href="/docs"><span>Docs</span></a>
</nav>

<div class="ledger" id="ledger">
  <div class="rw chip" data-at=".06"><i>Features shipped</i><b>0</b></div>
  <div class="rw chip" data-at=".20"><i>Roadmap items</i><b>0</b></div>
  <div class="rw chip" data-at=".34"><i>Partnerships</i><b>0</b></div>
  <div class="rw chip" data-at=".48"><i>Utility</i><b>0</b></div>
  <div class="rw chip" data-at=".62"><i>Things that happened</i><b>0</b></div>
  <div class="rw chip live" data-at=".74"><i>Minutes he has slept</i><b id="slept">0</b></div>
</div>

<div class="mark chip" id="mark"><h1>Does <em>Nothing</em></h1><p>It is doing it right now</p></div>
<div class="clock chip" id="clock"><b id="hhmm">05:40</b><span>Room time</span></div>

<div class="card chip" id="card">
  <div class="l">Contract</div>
  <div class="ca" id="ca"><b id="caVal">soon</b><button class="cp" id="caCopy">Copy</button></div>
  <div class="btns">
    <a class="key" data-link="pons" href="https://www.ponsfamily.com/launchpad">Buy on Pons<svg><use href="#i-pons"/></svg></a>
    <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
    <a class="key" href="/docs">Docs</a>
  </div>
</div>

<div class="runway" id="runway"></div>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pons" viewBox="0 0 64 64"><path d="M14 8h24c11 0 18 7 18 17s-7 17-18 17h-9v12a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M29 20h8c4 0 6.5 2 6.5 5s-2.5 5-6.5 5h-8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></symbol>
</svg>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS_CA = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS_CA ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });
  var caBox = document.getElementById('ca'), caVal = document.getElementById('caVal'), caCopy = document.getElementById('caCopy');
  caVal.textContent = HAS_CA ? CA : 'soon';
  if(HAS_CA){ caBox.classList.add('live'); caBox.title = CA; }
  caBox.addEventListener('click', function(){ var old = caCopy.textContent; if(HAS_CA){ if(navigator.clipboard) navigator.clipboard.writeText(CA); caCopy.textContent = 'Copied'; } else { caCopy.textContent = 'Not yet'; } setTimeout(function(){ caCopy.textContent = old; }, 1300); });

  var bgm = document.getElementById('bgm'), armed = false, hasMusic = true;
  bgm.addEventListener('error', function(){ hasMusic = false; });
  function arm(){ if(armed) return; armed = true; if(hasMusic){ bgm.volume = .2; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  /* ---- the only thing that moves ---- */
  var plates = [].slice.call(document.querySelectorAll('.room img'));
  var rows = [].slice.call(document.querySelectorAll('.ledger .rw'));
  var runway = document.getElementById('runway'), card = document.getElementById('card');
  var hhmm = document.getElementById('hhmm'), mark = document.getElementById('mark');
  var START = 5.6667, SPAN = 18;

  function layout(){ runway.style.height = ((innerHeight || 800) * 5.2) + 'px'; }
  addEventListener('resize', function(){ layout(); step(); }); addEventListener('load', function(){ layout(); step(); }); layout();

  var sm = 0;
  function step(){
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    var H = runway.offsetHeight - (innerHeight || 800);
    var p = H > 0 ? Math.max(0, Math.min(1, y / H)) : 0;
    sm += (p - sm) * .16;
    var t = sm * (plates.length - 1);
    plates.forEach(function(im, i){
      var d = Math.abs(t - i);
      im.style.opacity = d >= 1 ? 0 : (1 - d).toFixed(3);
    });
    var h = START + sm * SPAN, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60);
    hhmm.textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    rows.forEach(function(r){ r.classList.toggle('on', sm >= +r.dataset.at); });
    card.classList.toggle('on', sm > .86);
    mark.style.opacity = sm > .86 ? '0' : '1';
  }
  function frame(){ step(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  addEventListener('scroll', step, { passive: true });
  step(); plates[0].style.opacity = 1;

  /* the one honest number */
  var t0 = Date.now(), slept = document.getElementById('slept');
  setInterval(function(){ slept.textContent = ((Date.now() - t0) / 60000).toFixed(2); }, 600);
})();
</script>
</body>
</html>
